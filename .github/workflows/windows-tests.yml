# The unit suite on Windows, on demand: lists every failing test so they can
# be fixed without cutting a release.
name: windows-tests

on:
  workflow_dispatch:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Unit tests
        shell: bash
        env:
          OX_ISLAND: '0'
          OX_LEARN: '0'
          OX_NO_KEYSTORE: '1'
          OX_USAGE_LOG: '0'
          OX_NO_PLUGINS: '1'
          OX_NO_BUILTIN_SKILLS: '1'
        # Windows still has known failures: list them on the run's summary page
        # instead of marking every run red. Releases run the same suite.
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/verify.mjs --only unit 2>&1 | tee verify.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo '## Windows unit tests'; echo; grep -E '^(PASS|FAIL) unit' verify.txt || true; echo; echo '```'; sed -n '/^FAIL unit/,/verify failed/p' verify.txt | head -300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-unit-tap
          path: .ox-verify/unit.tap
