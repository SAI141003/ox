name: win-ipc-check (temporary)
on:
  push:
    branches: [claude/win-ipc-pipes]
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OX_ISLAND: '0'
      OX_LEARN: '0'
      OX_NO_KEYSTORE: '1'
      OX_USAGE_LOG: '0'
      OX_NO_PLUGINS: '1'
      OX_NO_BUILTIN_SKILLS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ipc + task board
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home"; export USERPROFILE="$HOME"; mkdir -p "$HOME"
          node --test --test-reporter=tap test/ipc.test.js test/task-board.test.js
