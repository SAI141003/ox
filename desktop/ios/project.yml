# OX for iPhone: `xcodegen` makes OXPhone.xcodeproj from this file.
#   cd desktop/ios && xcodegen && open OXPhone.xcodeproj
# Then pick your team (any Apple ID works) and run it on your iPhone.
name: OXPhone
options:
  bundleIdPrefix: ai.ox
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OXPhone:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: OXWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OX
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Face ID confirms each command you allow an agent to run on your Mac.
        NSLocalNetworkUsageDescription: OX talks to your Mac on your own network to show and answer what your agents ask.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.ox.phone
            CFBundleURLSchemes: [oxphone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ox.phone
        TARGETED_DEVICE_FAMILY: "1"
  OXWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: OX
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ox.phone.widgets
        TARGETED_DEVICE_FAMILY: "1"
