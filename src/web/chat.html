<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ox</title>
<style>
  :root {
    --bg: #0E0F12; --panel: #15161A; --raise: #1C1D22; --line: #2A2B31;
    --text: #F2F1EE; --muted: #9A9AA3; --dim: #6B6B74;
    --gold: #E9A66B; --gold-ink: #1A1512; --green: #34D399; --red: #F4505E; --amber: #F5A524;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #FAF9F7; --panel: #F2F0EC; --raise: #FFFFFF; --line: #E2DED7;
      --text: #1B1A18; --muted: #6E6A63; --dim: #9C978F; --gold: #C47A3A; --gold-ink: #FFFFFF;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); display: grid; grid-template-columns: 260px 1fr; }
  button, select, textarea, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* sidebar */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; font-weight: 800; letter-spacing: -0.02em; font-size: 18px; }
  .brand svg { width: 26px; height: 26px; }
  .new { margin: 0 12px 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); text-align: left; display: flex; gap: 8px; align-items: center; }
  .new:hover { border-color: var(--gold); }
  .convos { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
  .convo { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 10px; border-radius: 8px; border: 0; background: none; text-align: left; color: var(--muted); font-size: 13.5px; }
  .convo span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .convo:hover, .convo.on { background: var(--raise); color: var(--text); }
  .convo .x { opacity: 0; border: 0; background: none; color: var(--dim); padding: 0 4px; }
  .convo:hover .x { opacity: 1; }
  .foot { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; }

  /* main */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  header select { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 320px; }
  .menu { display: none; border: 0; background: none; font-size: 20px; }
  .spacer { flex: 1; }
  .usage { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .thread { flex: 1; overflow-y: auto; padding: 24px 20px 40px; }
  .inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .msg { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
  .who { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .who.user { background: var(--raise); border: 1px solid var(--line); color: var(--muted); }
  .who.ox { background: var(--gold); color: var(--gold-ink); }
  .body { min-width: 0; padding-top: 3px; }
  .body p { margin: 0 0 10px; }
  .body p:last-child { margin-bottom: 0; }
  .body ul, .body ol { margin: 0 0 10px; padding-left: 22px; }
  .body h3 { margin: 14px 0 6px; font-size: 15px; }
  .body a { color: var(--gold); }
  .body code { font: 13px var(--mono); background: var(--raise); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  .code { position: relative; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .code .bar { display: flex; justify-content: space-between; padding: 6px 10px; font: 12px var(--mono); color: var(--dim); border-bottom: 1px solid var(--line); }
  .code .bar button { border: 0; background: none; color: var(--muted); font-size: 12px; }
  .code pre { margin: 0; padding: 12px; overflow-x: auto; font: 13px/1.5 var(--mono); }
  .code pre code { background: none; border: 0; padding: 0; }
  .tool { display: inline-flex; align-items: center; gap: 7px; margin: 0 6px 8px 0; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font: 12.5px var(--mono); color: var(--muted); max-width: 100%; }
  .tool b { color: var(--text); font-weight: 600; }
  .tool .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); animation: pulse 1s infinite; flex: none; }
  .tool.ok .dot { background: var(--green); animation: none; }
  .tool.err .dot { background: var(--red); animation: none; }
  .tool span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { color: var(--red); }
  .typing { display: inline-flex; gap: 4px; padding-top: 6px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); animation: pulse 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  .empty { margin: 14vh auto 0; text-align: center; max-width: 560px; }
  .empty h1 { font-size: 28px; letter-spacing: -0.02em; margin: 12px 0 6px; }
  .empty p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chip { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 13.5px; }
  .chip:hover { border-color: var(--gold); color: var(--text); }

  /* composer */
  .composer { padding: 12px 20px 18px; }
  .box { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--raise); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; }
  .box:focus-within { border-color: var(--gold); }
  textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; max-height: 220px; padding: 6px 0; line-height: 1.5; }
  .send { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; flex: none; }
  .send:disabled { opacity: .35; cursor: default; }
  .mode { flex: none; align-self: flex-end; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--muted); padding: 0 8px; font-size: 12.5px; }
  .mode:focus { outline: 0; border-color: var(--gold); color: var(--text); }
  .routed { display: inline-block; margin: 0 0 8px; font-size: 12px; color: var(--dim); }
  .hint { max-width: 780px; margin: 6px auto 0; font-size: 11.5px; color: var(--dim); text-align: center; }

  /* key dialog */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--raise); color: var(--text); padding: 20px; width: min(420px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog input { width: 100%; margin: 12px 0; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
  dialog button { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); }
  dialog button.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
    body.nav aside { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.5); }
    .menu { display: block; }
    .thread { padding: 18px 16px 30px; }
    .composer { padding: 10px 16px 14px; }
    .chips { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 9c-3-1-4-5-3-7 2 2 4 3 7 4M26 9c3-1 4-5 3-7-2 2-4 3-7 4" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round"/><rect x="7" y="7" width="18" height="17" rx="7" fill="var(--gold)"/><rect x="10" y="17" width="12" height="8" rx="4" fill="#FFE8CF"/><circle cx="12.5" cy="14" r="1.5" fill="#1A1512"/><circle cx="19.5" cy="14" r="1.5" fill="#1A1512"/></svg>
    ox
  </div>
  <button class="new" id="new"><span aria-hidden="true">＋</span> New chat</button>
  <nav class="convos" id="convos" aria-label="Conversations"></nav>
  <div class="foot"><span id="where">local</span><button id="theme" style="border:0;background:none;color:inherit">Theme</button></div>
</aside>

<main>
  <header>
    <button class="menu" id="menu" aria-label="Conversations">☰</button>
    <select id="model" aria-label="Model"></select>
    <div class="spacer"></div>
    <span class="usage" id="usage"></span>
  </header>
  <div class="thread" id="thread"><div class="inner" id="inner"></div></div>
  <div class="composer">
    <div class="box">
      <select class="mode" id="mode" aria-label="Mode" title="What kind of help: enforced, not just a hint">
        <option value="auto">Auto</option>
        <option value="code">Code</option>
        <option value="ask">Ask</option>
        <option value="plan">Plan</option>
        <option value="debug">Debug</option>
        <option value="orchestrate">Orchestrate</option>
      </select>
      <textarea id="input" rows="1" placeholder="Ask ox to read, change or explain this project…" aria-label="Message"></textarea>
      <button class="send" id="send" aria-label="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line · Ask and Plan never change your files · ox runs in this project's folder on your machine</div>
  </div>
</main>

<dialog id="keydlg">
  <form method="dialog">
    <strong>This server needs its API key</strong>
    <div style="color:var(--muted);font-size:13.5px;margin-top:4px">The value of OX_SERVE_API_KEY. It is kept in this tab only.</div>
    <input id="keyin" type="password" autocomplete="off" aria-label="API key">
    <div class="row"><button value="cancel">Cancel</button><button value="ok" class="primary">Connect</button></div>
  </form>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let key = (() => { try { return sessionStorage.getItem('ox.key') || ''; } catch { return ''; } })();
  let convos = store.get('ox.convos', []);
  let current = convos[0]?.id ?? null;
  let busy = null; // AbortController of the running request
  const SUGGESTIONS = [
    'Explain how this project is organised',
    'Find the slowest test and tell me why',
    'What changed in the last commit?',
    'Draft a README section for setup',
  ];

  // ---------- theme
  const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; };
  applyTheme(store.get('ox.theme', null));
  $('theme').onclick = () => {
    const now = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const next = now === 'dark' ? 'light' : 'dark';
    applyTheme(next); store.set('ox.theme', next);
  };
  $('menu').onclick = () => document.body.classList.toggle('nav');
  $('where').textContent = location.host;

  // ---------- api
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(key ? { Authorization: `Bearer ${key}` } : {}) };
    const res = await fetch(path, { ...opts, headers });
    if (res.status === 401) {
      if (await askKey()) return api(path, opts);
      throw new Error('This server needs its API key.');
    }
    return res;
  }
  function askKey() {
    return new Promise((resolve) => {
      const d = $('keydlg');
      $('keyin').value = '';
      d.onclose = () => {
        if (d.returnValue === 'ok' && $('keyin').value) {
          key = $('keyin').value;
          try { sessionStorage.setItem('ox.key', key); } catch {}
          resolve(true);
        } else resolve(false);
      };
      d.showModal();
    });
  }
  async function loadModels() {
    const sel = $('model');
    try {
      const res = await api('/v1/models');
      const { data = [] } = await res.json();
      sel.innerHTML = '';
      // Your agents first (agent:<name>), then the models.
      const groups = [['Your agents', data.filter((m) => m.ox?.agent)], ['Models', data.filter((m) => !m.ox?.agent)]];
      for (const [label, list] of groups) {
        if (!list.length) continue;
        const g = document.createElement('optgroup');
        g.label = label;
        for (const m of list) {
          const o = document.createElement('option');
          o.value = m.id;
          o.textContent = m.ox?.agent ? `${m.id.slice(6)} · ${m.ox.mode}` : m.id;
          if (m.ox?.agent) o.title = `${m.ox.bot ?? 'default bot'} · ${m.ox.mode}${m.ox.desc ? ` — ${m.ox.desc}` : ''}`;
          g.append(o);
        }
        sel.append(g);
      }
      const saved = store.get('ox.model', null);
      if (saved && data.some((m) => m.id === saved)) sel.value = saved;
      if (!data.length) sel.innerHTML = '<option value="">no models configured</option>';
    } catch (e) {
      sel.innerHTML = '<option value="">server unreachable</option>';
    }
  }
  $('model').onchange = () => store.set('ox.model', $('model').value);

  // ---------- conversations
  const convo = () => convos.find((c) => c.id === current);
  const save = () => store.set('ox.convos', convos.slice(0, 100));
  function newConvo() {
    const c = { id: `c${Date.now()}`, title: 'New chat', messages: [] };
    convos.unshift(c); current = c.id; save(); render();
    $('input').focus();
  }
  function renderList() {
    const nav = $('convos');
    nav.innerHTML = '';
    for (const c of convos) {
      const b = document.createElement('button');
      b.className = `convo${c.id === current ? ' on' : ''}`;
      const s = document.createElement('span'); s.textContent = c.title;
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', `Delete ${c.title}`);
      x.onclick = (e) => { e.stopPropagation(); convos = convos.filter((y) => y.id !== c.id); if (current === c.id) current = convos[0]?.id ?? null; save(); render(); };
      b.append(s, x);
      b.onclick = () => { current = c.id; document.body.classList.remove('nav'); render(); };
      nav.append(b);
    }
  }

  // ---------- markdown (small, safe: everything is escaped first)
  const esc = (s) => s.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function md(text) {
    const out = [];
    const parts = String(text).split(/```/);
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const nl = part.indexOf('\n');
        const lang = nl > 0 ? part.slice(0, nl).trim() : '';
        const code = nl >= 0 ? part.slice(nl + 1) : part;
        out.push(`<div class="code"><div class="bar"><span>${esc(lang || 'code')}</span><button data-copy>Copy</button></div><pre><code>${esc(code.replace(/\n$/, ''))}</code></pre></div>`);
        return;
      }
      let list = null;
      for (const raw of part.split('\n')) {
        const line = raw.trimEnd();
        const ul = /^\s*[-*] (.*)$/.exec(line);
        const ol = /^\s*\d+[.)] (.*)$/.exec(line);
        if (ul || ol) {
          const tag = ul ? 'ul' : 'ol';
          if (list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
          out.push(`<li>${inline((ul || ol)[1])}</li>`);
          continue;
        }
        if (list) { out.push(`</${list}>`); list = null; }
        if (!line.trim()) continue;
        const h = /^#{1,4} (.*)$/.exec(line);
        out.push(h ? `<h3>${inline(h[1])}</h3>` : `<p>${inline(line)}</p>`);
      }
      if (list) out.push(`</${list}>`);
    });
    return out.join('');
  }

  // ---------- thread
  function bubble(role) {
    const m = document.createElement('div');
    m.className = 'msg';
    const who = document.createElement('div');
    who.className = `who ${role === 'user' ? 'user' : 'ox'}`;
    who.textContent = role === 'user' ? 'you' : 'ox';
    const body = document.createElement('div');
    body.className = 'body';
    m.append(who, body);
    $('inner').append(m);
    return body;
  }
  // The mode is remembered per browser; Auto when nothing was chosen.
  try { $('mode').value = localStorage.getItem('ox.mode') || 'auto'; } catch {}
  $('mode').onchange = () => { try { localStorage.setItem('ox.mode', $('mode').value); } catch {} };
  function paint(body, msg) {
    const tools = (msg.tools || []).map((t) =>
      `<span class="tool ${t.state}"><i class="dot"></i><b>${esc(t.name)}</b><span>${esc(t.preview || '')}</span></span>`).join('');
    const text = msg.content ? md(msg.content) : (msg.pending ? '<span class="typing"><i></i><i></i><i></i></span>' : '');
    const routed = msg.routed ? `<span class="routed">${esc(msg.routed)}</span>` : '';
    body.innerHTML = routed + (tools ? `<div>${tools}</div>` : '') + text + (msg.error ? `<p class="err">${esc(msg.error)}</p>` : '');
  }
  function render() {
    renderList();
    const c = convo();
    const inner = $('inner');
    inner.innerHTML = '';
    if (!c || !c.messages.length) {
      inner.innerHTML = `<div class="empty"><h1>What should ox do?</h1><p>ox works in this project on your machine: it reads, edits, runs and explains.</p><div class="chips">${SUGGESTIONS.map((s) => `<button class="chip">${esc(s)}</button>`).join('')}</div></div>`;
      inner.querySelectorAll('.chip').forEach((b) => (b.onclick = () => { $('input').value = b.textContent; send(); }));
      return;
    }
    for (const m of c.messages) paint(bubble(m.role), m);
    scrollDown();
  }
  const scrollDown = () => { const t = $('thread'); t.scrollTop = t.scrollHeight; };
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    navigator.clipboard?.writeText(b.closest('.code').querySelector('code').textContent);
    b.textContent = 'Copied'; setTimeout(() => (b.textContent = 'Copy'), 1200);
  });

  // ---------- send / stream
  async function send() {
    const input = $('input');
    const text = input.value.trim();
    if (busy) { busy.abort(); return; }
    if (!text) return;
    if (!convo()) newConvo();
    const c = convo();
    if (!c.messages.length) c.title = text.slice(0, 48);
    c.messages.push({ role: 'user', content: text });
    const reply = { role: 'assistant', content: '', tools: [], pending: true };
    c.messages.push(reply);
    input.value = ''; resize(); save(); render();
    const body = $('inner').lastElementChild.querySelector('.body');
    busy = new AbortController();
    setBusy(true);
    try {
      const res = await api('/v1/chat/completions', {
        method: 'POST',
        signal: busy.signal,
        body: JSON.stringify({
          model: $('model').value || undefined,
          ox_mode: $('mode').value,
          stream: true,
          messages: c.messages.filter((m) => m !== reply).map(({ role, content }) => ({ role, content })),
        }),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({})))?.error?.message || `HTTP ${res.status}`);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const frame = buf.slice(0, i); buf = buf.slice(i + 2);
          const data = frame.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('');
          if (!data || data === '[DONE]') continue;
          let ev; try { ev = JSON.parse(data); } catch { continue; }
          if (ev.error) { reply.error = ev.error.message; continue; }
          const ox = ev.ox;
          if (ox?.type === 'mode') reply.routed = `${ox.routed ? 'auto → ' : ''}${ox.mode}${ox.reason ? ` · ${ox.reason}` : ''}`;
          if (ox?.type === 'tool-start') reply.tools.push({ id: ox.id, name: ox.name, preview: ox.preview, state: '' });
          if (ox?.type === 'tool-end') {
            const t = reply.tools.find((x) => x.id === ox.id) || reply.tools.at(-1);
            if (t) t.state = ox.isError ? 'err' : 'ok';
          }
          const delta = ev.choices?.[0]?.delta?.content;
          if (delta) reply.content += delta;
          if (ev.usage) $('usage').textContent = `${(ev.usage.prompt_tokens || 0) + (ev.usage.completion_tokens || 0)} tokens`;
          reply.pending = !reply.content;
          paint(body, reply); scrollDown();
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') reply.error = e.message;
      else reply.error = 'Stopped.';
    } finally {
      reply.pending = false;
      busy = null; setBusy(false);
      paint(body, reply); save();
    }
  }
  function setBusy(on) {
    const b = $('send');
    b.disabled = !on && !$('input').value.trim();
    b.innerHTML = on
      ? '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2" fill="currentColor"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.setAttribute('aria-label', on ? 'Stop' : 'Send');
  }
  function resize() {
    const t = $('input');
    t.style.height = 'auto';
    t.style.height = `${Math.min(220, t.scrollHeight)}px`;
    if (!busy) $('send').disabled = !t.value.trim();
  }
  $('input').addEventListener('input', resize);
  $('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  $('send').onclick = send;
  $('new').onclick = newConvo;

  loadModels();
  render();
})();
</script>
</body>
</html>
