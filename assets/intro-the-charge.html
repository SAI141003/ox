<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OX — The Charge</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  #stage {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }

  .skip-btn {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    font: 400 12px/1 'JetBrains Mono', monospace;
    color: #8A8A93; letter-spacing: 0.12em; text-transform: uppercase;
    background: none; border: none; cursor: pointer;
    opacity: 0; pointer-events: none; z-index: 100;
    transition: opacity 120ms ease;
  }
  .skip-btn.visible { opacity: 1; pointer-events: auto; }
  .skip-btn:hover { color: #EDEAE4; }

  .ember {
    position: fixed; bottom: 0;
    width: 3px; height: 3px;
    background: #FF7A1A; border-radius: 50%;
    opacity: 0;
    animation: emberDrift linear infinite;
    will-change: transform, opacity;
  }
  @keyframes emberDrift {
    0%   { opacity: 0; transform: translateY(0) scale(1); }
    10%  { opacity: 0.9; }
    80%  { opacity: 0.4; }
    100% { opacity: 0; transform: translateY(-100vh) scale(0.3); }
  }

  #bull-container {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #bull-svg {
    width: 260px; height: 260px;
    filter: drop-shadow(0 0 0px rgba(255,122,26,0));
    transition: filter 200ms ease;
  }
  #bull-svg .bull-stroke {
    fill: none; stroke: #FF7A1A;
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }
  #bull-svg .bull-fill {
    fill: none; stroke: #FF7A1A;
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }

  .bull-eye {
    fill: #FF7A1A; opacity: 0;
    animation: eyeIgnite 0.6s ease-out forwards;
    animation-delay: 0ms;
    filter: blur(0px);
  }
  @keyframes eyeIgnite {
    0%   { opacity: 0; filter: blur(0px); }
    30%  { opacity: 1; filter: blur(2px); }
    100% { opacity: 0.9; filter: blur(0px); }
  }

  .snort-puff {
    position: fixed; width: 20px; height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,122,26,0.5);
    opacity: 0; pointer-events: none;
    animation: snortPuff 1.2s ease-out forwards;
  }
  @keyframes snortPuff {
    0%   { opacity: 0.7; transform: scale(0.4); }
    100% { opacity: 0; transform: scale(2.2); }
  }

  #wordmark {
    position: fixed; bottom: 18%; left: 50%; transform: translateX(-50%);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 72px; font-weight: 700; letter-spacing: 0.18em;
    color: #EDEAE4; opacity: 0;
    z-index: 15; pointer-events: none;
  }

  #impact-flash {
    position: fixed; inset: 0;
    background: #fff; opacity: 0;
    z-index: 50; pointer-events: none;
  }
  #impact-flash.flash { animation: whiteFlash 150ms ease-out forwards; }
  @keyframes whiteFlash {
    0% { opacity: 0.9; } 100% { opacity: 0; }
  }

  .shake { animation: screenShake 200ms ease-in-out; }
  @keyframes screenShake {
    0%, 100% { transform: translateY(0); }
    25% { transform: translateY(-2px); }
    50% { transform: translateY(2px); }
    75% { transform: translateY(-1px); }
  }

  .dust {
    position: fixed; bottom: 0;
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,122,26,0.3) 0%, transparent 70%);
    opacity: 0; pointer-events: none; z-index: 8;
    animation: dustBurst 0.6s ease-out forwards;
  }
  .dust.left  { left: 5%; }
  .dust.right { right: 5%; }
  @keyframes dustBurst {
    0%   { opacity: 1; transform: scale(0.3); }
    100% { opacity: 0; transform: scale(2.5); }
  }

  #tagline {
    position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 400; letter-spacing: 0.25em; text-transform: uppercase;
    color: #8A8A93; opacity: 0;
    z-index: 15; pointer-events: none; white-space: nowrap;
  }

  #app-morph { position: fixed; inset: 0; display: none; z-index: 5; }
  #app-morph.active { display: flex; }

  .panel {
    position: absolute;
    background: rgba(18,18,22,0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    backdrop-filter: blur(16px);
    will-change: transform;
  }
  .panel.tl { top: 24px; left: 24px; width: 280px; height: 200px; animation: panelSlideTL 0.4s cubic-bezier(0.2,0.8,0.2,1) forwards; opacity: 0; }
  .panel.tr { top: 24px; right: 24px; width: 280px; height: 200px; animation: panelSlideTR 0.4s cubic-bezier(0.2,0.8,0.2,1) 0.05s forwards; opacity: 0; }
  .panel.bl { bottom: 24px; left: 24px; width: 320px; height: 240px; animation: panelSlideBL 0.4s cubic-bezier(0.2,0.8,0.2,1) 0.1s forwards; opacity: 0; }
  .panel.br { bottom: 24px; right: 24px; width: 320px; height: 240px; animation: panelSlideBR 0.4s cubic-bezier(0.2,0.8,0.2,1) 0.15s forwards; opacity: 0; }
  @keyframes panelSlideTL { to { opacity: 1; transform: translateY(0); } }
  @keyframes panelSlideTR { to { opacity: 1; transform: translateY(0); } }
  @keyframes panelSlideBL { to { opacity: 1; transform: translateY(0); } }
  @keyframes panelSlideBR { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .ember, .bull-stroke, .bull-fill, .bull-eye, .snort-puff, .dust,
    #wordmark, #tagline, .panel, #impact-flash, #bull-svg {
      animation: none !important; transition: none !important;
    }
    .fallback-logo { display: flex !important; }
    .fallback-crossfade { animation: fallbackFade 400ms ease forwards !important; }
    @keyframes fallbackFade { from { opacity: 0; } to { opacity: 1; } }
  }

  .fallback-logo {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center;
    background: #000; z-index: 200;
  }
  .fallback-logo svg { width: 200px; height: 200px; }
</style>
</head>
<body>

<div class="fallback-logo" id="fallback">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#FF7A1A" stroke-width="3"/>
    <text x="100" y="115" text-anchor="middle" fill="#EDEAE4" font-family="Space Grotesk" font-size="48" font-weight="700">OX</text>
  </svg>
</div>

<div id="stage">
  <div id="embers"></div>
  <button class="skip-btn" id="skipBtn">Press any key / click to skip</button>
  <div id="impact-flash"></div>
  <div class="dust left" id="dustL"></div>
  <div class="dust right" id="dustR"></div>

  <div id="bull-container">
    <svg id="bull-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path class="bull-stroke" data-section="outline"
        d="M60,55 Q50,25 65,18 Q80,12 90,28 Q95,38 88,48
           M90,48 Q100,52 110,48 Q120,42 118,30 Q115,18 125,15
           Q140,12 145,25 Q148,38 140,48
           M110,48 Q130,55 140,70 Q150,90 148,110 Q145,130 135,140
           Q125,148 118,142 Q112,136 115,128 Q118,120 125,122
           M60,55 Q48,70 45,88 Q42,105 48,118 Q55,128 65,122
           Q75,116 72,105 Q70,95 62,90
           M65,122 Q72,132 78,145 Q82,155 78,162 Q74,168 70,165
           M135,140 Q142,150 148,160 Q152,168 148,172 Q144,174 140,170
           M70,165 Q75,172 82,176 Q88,178 92,174
           M148,172 Q152,178 158,180 Q162,180 164,176
           M90,48 Q85,65 88,80 Q90,90 95,95
           M110,48 Q115,60 118,75 Q120,85 122,92
           M95,95 Q100,105 105,108 Q112,110 115,105
           M122,92 Q128,100 130,108 Q132,115 128,118
           M115,105 Q110,115 108,122 Q106,128 110,130
           M128,118 Q124,128 122,135 Q120,140 124,142" />
      <circle class="bull-eye" cx="78" cy="72" r="4" />
      <circle class="bull-eye" cx="125" cy="72" r="4" />
    </svg>
  </div>

  <div id="wordmark">OX</div>
  <div id="tagline">Unleash the charge</div>

  <div id="app-morph">
    <div class="panel tl"></div>
    <div class="panel tr"></div>
    <div class="panel bl"></div>
    <div class="panel br"></div>
  </div>
</div>

<script>
(function() {
  'use strict';
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var AUDIO_ON = false;

  function createEmbers() {
    var container = document.getElementById('embers');
    for (var i = 0; i < 20; i++) {
      var e = document.createElement('div');
      e.className = 'ember';
      e.style.left = (Math.random() * 100) + '%';
      e.style.animationDuration = (3 + Math.random() * 3) + 's';
      e.style.animationDelay = (Math.random() * 2) + 's';
      var sz = 2 + Math.random() * 3;
      e.style.width = sz + 'px';
      e.style.height = sz + 'px';
      container.appendChild(e);
    }
  }

  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  function playHeartbeat(t) {
    if (!AUDIO_ON || !audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(40, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.4);
  }
  function playSubHit(t) {
    if (!AUDIO_ON || !audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(35, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.35, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.3);
  }

  function animateBullStroke() {
    var p = document.querySelector('.bull-stroke');
    if (!p) return;
    var len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.transition = 'stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1)';
    requestAnimationFrame(function() { p.style.strokeDashoffset = '0'; });
  }

  function spawnSnort() {
    var svg = document.getElementById('bull-svg');
    if (!svg) return;
    var r = svg.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2 + 60;
    for (var i = 0; i < 3; i++) {
      var puff = document.createElement('div');
      puff.className = 'snort-puff';
      puff.style.left = (cx - 10 + (i - 1) * 16) + 'px';
      puff.style.top = (cy + Math.random() * 10) + 'px';
      puff.style.animationDelay = (i * 0.15) + 's';
      document.body.appendChild(puff);
      (function(pp) { setTimeout(function() { if (pp.parentNode) pp.parentNode.removeChild(pp); }, 1500); })(puff);
    }
  }

  var finished = false;
  function finishIntro() {
    if (finished) return;
    finished = true;
    var s = document.getElementById('stage');
    var em = document.getElementById('embers');
    var sk = document.getElementById('skipBtn');
    var b = document.getElementById('bull-container');
    var w = document.getElementById('wordmark');
    var tg = document.getElementById('tagline');
    var dl = document.getElementById('dustL');
    var dr = document.getElementById('dustR');
    if (s) s.style.display = 'none';
    if (em) em.style.display = 'none';
    if (sk) sk.style.display = 'none';
    if (dl) dl.style.display = 'none';
    if (dr) dr.style.display = 'none';
    var m = document.getElementById('app-morph');
    if (m) m.classList.add('active');
    if (b) b.style.display = 'none';
    if (w) w.style.display = 'none';
    if (tg) tg.style.display = 'none';
  }

  function startIntro() {
    createEmbers();
    var sb = document.getElementById('skipBtn');
    if (sb) setTimeout(function() { sb.classList.add('visible'); }, 400);

    setTimeout(function() { if (AUDIO_ON) { ensureAudio(); playHeartbeat(audioCtx.currentTime); } }, 600);
    setTimeout(function() { if (!REDUCED) animateBullStroke(); }, 600);
    setTimeout(function() {
      var eyes = document.querySelectorAll('.bull-eye');
      eyes.forEach(function(e) { e.style.opacity = '1'; });
      if (REDUCED) { var svg = document.getElementById('bull-svg'); if (svg) svg.style.filter = 'drop-shadow(0 0 12px rgba(255,122,26,0.4))'; }
    }, 1600);
    setTimeout(function() { spawnSnort(); }, 1800);
    setTimeout(function() {
      var st = document.getElementById('stage');
      if (st) st.classList.add('shake');
      if (AUDIO_ON) { ensureAudio(); playSubHit(audioCtx.currentTime); }
      var fl = document.getElementById('impact-flash');
      if (fl) fl.classList.add('flash');
      var wm = document.getElementById('wordmark');
      if (wm) wm.style.opacity = '1';
      setTimeout(function() { if (st) st.classList.remove('shake'); if (fl) fl.classList.remove('flash'); }, 300);
    }, 2200);
    setTimeout(function() {
      var tl = document.getElementById('tagline');
      if (tl) { tl.style.transition = 'opacity 0.5s ease'; tl.style.opacity = '1'; }
    }, 2600);
    setTimeout(function() { finishIntro(); }, 3600);
  }

  var skipped = false;
  function skipIntro() { if (!skipped) { skipped = true; finishIntro(); } }
  document.addEventListener('keydown', skipIntro);
  document.addEventListener('click', skipIntro);

  function enableAudio() { if (!AUDIO_ON) { AUDIO_ON = true; ensureAudio(); } }
  document.addEventListener('keydown', enableAudio, { once: true });
  document.addEventListener('click', enableAudio, { once: true });

  if (REDUCED) {
    var fb = document.getElementById('fallback');
    if (fb) fb.classList.add('fallback-crossfade');
    setTimeout(function() { finishIntro(); }, 400);
  } else {
    requestAnimationFrame(function() { requestAnimationFrame(startIntro); });
  }
})();
</script>
</body>
</html>
