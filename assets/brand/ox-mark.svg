<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 108 96" role="img" aria-labelledby="t">
  <title id="t">ox</title>
  <!-- Same geometry as OxPainter (desktop/island/Sources/OxIsland/Mascot.swift), 100-unit grid. -->
  <defs>
    <linearGradient id="hide" x1="38" y1="25" x2="62" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FACE9D"/>
      <stop offset="0.5" stop-color="#E9A66B"/>
      <stop offset="1" stop-color="#BD713B"/>
    </linearGradient>
    <radialGradient id="key" cx="38" cy="36" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hornL" x1="32" y1="32" x2="3" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9C6A8"/>
      <stop offset="1" stop-color="#FFF6E6"/>
    </linearGradient>
    <linearGradient id="hornR" x1="68" y1="32" x2="97" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9C6A8"/>
      <stop offset="1" stop-color="#FFF6E6"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="50" y1="58" x2="50" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE8CF"/>
      <stop offset="1" stop-color="#EFC8A6"/>
    </linearGradient>
  </defs>
  <!-- horns: thick at the poll, sweeping out, tips up -->
  <path d="M36 36 C12 38 2 24 3 9 C8 20 16 27 30 26 Z" fill="url(#hornL)"/>
  <path d="M64 36 C88 38 98 24 97 9 C92 20 84 27 70 26 Z" fill="url(#hornR)"/>
  <!-- ears -->
  <g transform="translate(20 44) rotate(-18)"><ellipse cx="-11" cy="0" rx="11" ry="6.5" fill="#BD713B"/><ellipse cx="-7" cy="0" rx="7" ry="3.5" fill="#F6968A"/></g>
  <g transform="translate(80 44) rotate(18)"><ellipse cx="11" cy="0" rx="11" ry="6.5" fill="#BD713B"/><ellipse cx="7" cy="0" rx="7" ry="3.5" fill="#F6968A"/></g>
  <!-- head: flat broad poll, square jaw -->
  <path d="M50 25 C72 25 81 31 81 46 C81 64 79 82 70 85 L30 85 C21 82 19 64 19 46 C19 31 28 25 50 25 Z" fill="url(#hide)"/>
  <path d="M50 25 C72 25 81 31 81 46 C81 64 79 82 70 85 L30 85 C21 82 19 64 19 46 C19 31 28 25 50 25 Z" fill="url(#key)"/>
  <!-- forehead curl -->
  <path d="M43 31 Q43 22 51 22 Q58 24 56 31 Q50 35 43 31 Z" fill="#BD713B"/>
  <!-- eyes with catchlights -->
  <circle cx="37" cy="50" r="5.4" fill="#1A1512"/><circle cx="35.3" cy="47.8" r="1.7" fill="#FFFFFF"/>
  <circle cx="63" cy="50" r="5.4" fill="#1A1512"/><circle cx="61.3" cy="47.8" r="1.7" fill="#FFFFFF"/>
  <!-- muzzle, nostrils, brass ring -->
  <ellipse cx="50" cy="70.5" rx="21" ry="12.5" fill="url(#muzzle)"/>
  <ellipse cx="42" cy="71" rx="2.6" ry="3.1" fill="#1A1512" fill-opacity="0.75"/>
  <ellipse cx="58" cy="71" rx="2.6" ry="3.1" fill="#1A1512" fill-opacity="0.75"/>
  <path d="M45.9 77.6 A5 5 0 1 0 54.1 77.6" fill="none" stroke="#F2C14E" stroke-width="2.4" stroke-linecap="round"/>
</svg>
